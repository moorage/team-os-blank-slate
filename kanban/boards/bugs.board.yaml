id: bugs
name: Bugs
description: Bug and incident work from triage through resolution.
card_types:
  - bug
  - incident
columns:
  - id: triage
    label: Triage
  - id: investigating
    label: Investigating
    wip_limit: 4
  - id: fixing
    label: Fixing
    wip_limit: 4
  - id: blocked
    label: Blocked
    wip_limit: 3
  - id: validating
    label: Validating
    wip_limit: 3
